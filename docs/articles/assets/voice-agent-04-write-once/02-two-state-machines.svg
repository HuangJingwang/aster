" style="fill:#D9480F">B </tspan><tspan style="fill:#D9480F">打断先到</tspan></text><text x="980" y="694" style="font-size:40px;fill:#D9480F" text-anchor="start">播报 = 已打断</text><text x="980" y="758" style="font-size:40px;fill:#0B1220" text-anchor="start">晚到的完成回调</text><text x="980" y="824" style="font-size:44px;fill:#B42318" text-anchor="start">丢弃</text><path d="M1221 792 L1255 825 M1255 792 L1221 825" fill="none" stroke="#B42318" stroke-width="4"/><g transform="rotate(-0.18 720.0 962.5)"><path d="M82 921 L681.48 918 L1360 922 L1362 967.84 L1358 1007 L745.6800000000001 1005 L79 1006 L78 955.38 Z" fill="#0B1220" opacity=".08" transform="translate(5 6)"/><path d="M82 921 L681.48 918 L1360 922 L1362 967.84 L1358 1007 L745.6800000000001 1005 L79 1006 L78 955.38 Z" fill="#FFFCF5" stroke="#0B1220" stroke-width="2.8"/><path d="M86 924 L681.48 921 L1354 925" fill="none" stroke="#0B1220" stroke-width="1" opacity=".2"/><path d="M82 921 L681.48 918 L1360 922 L1362 967.84 L1358 1007 L745.6800000000001 1005 L79 1006 L78 955.38 Z" fill="url(#grain)"/></g><text x="108" y="975" style="font-size:40px"><tspan class="mono" style="fill:#0B1220">v1</tspan><tspan style="fill:#0B1220"> 回调不能改写 </tspan><tspan class="mono" style="fill:#1D4ED8">v2</tspan><tspan style="fill:#0B1220">；重播另开 </tspan><tspan class="mono" style="fill:#1D4ED8">epoch</tspan></text></svg>